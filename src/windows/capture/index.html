<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tuck a thought</title>
  <link rel="stylesheet" href="../../styles/tokens.css" />
  <link rel="stylesheet" href="./capture.css" />
</head>
<body>
  <main id="stage">
    <div class="perch" id="perch">
      <div class="bubble" id="bubble" role="status" aria-live="polite" hidden></div>
    </div>

    <section class="win capture" id="win" aria-label="Tuck a thought">
      <header class="titlebar">
        <span class="title">tuck a thought</span>
        <button class="tbtn" id="open-lib" title="See all my thoughts (Ctrl+L)" aria-label="See all my thoughts">
          <svg width="10" height="10" viewBox="0 0 10 10" shape-rendering="crispEdges"><path d="M1 1h8v2H1zM1 4h8v2H1zM1 7h8v2H1z" fill="currentColor"/></svg>
        </button>
        <button class="tbtn" id="close" title="Close (Esc). What you typed stays here for next time" aria-label="Close">
          <svg width="10" height="10" viewBox="0 0 10 10" shape-rendering="crispEdges"><path d="M1 1h2v2H1zM3 3h2v2H3zM5 5h2v2H5zM7 7h2v2H7zM7 1h2v2H7zM5 3h2v2H5zM3 5h2v2H3zM1 7h2v2H1z" fill="currentColor"/></svg>
        </button>
      </header>

      <div class="body">
        <label class="sr" for="text">Your thought</label>
        <textarea id="text" class="field" spellcheck="true" rows="4" autofocus placeholder="What's on your mind?"></textarea>

        <footer class="row">
          <button class="btn vault-btn" id="vault-btn" aria-haspopup="listbox" aria-expanded="false" title="Put it in a vault (optional). Ctrl+1 to 9 picks one">
            <span class="chip-dot" id="vault-dot"></span>
            <span id="vault-name">unsorted</span>
            <svg width="8" height="8" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><path d="M0 2h8v2H6v2H2V4H0z" fill="currentColor"/></svg>
          </button>
          <span class="hint" id="hint" title="Shift+Enter for a new line"><span class="kbd">esc</span> close</span>
          <button class="btn primary" id="save">save <span aria-hidden="true">↵</span></button>
        </footer>

        <div class="picker win" id="picker" hidden>
          <ul role="listbox" id="picker-list" aria-label="Choose a vault"></ul>
          <form class="new-vault" id="new-vault" hidden>
            <input class="field" id="new-vault-name" maxlength="40" placeholder="name your vault" aria-label="New vault name" />
          </form>
        </div>
      </div>
    </section>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
