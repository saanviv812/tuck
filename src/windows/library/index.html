<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tuck</title>
  <link rel="stylesheet" href="../../styles/tokens.css" />
  <link rel="stylesheet" href="./library.css" />
</head>
<body>
  <div class="app win" id="app">
    <header class="titlebar">
      <span class="title">tuck</span>
      <button class="tbtn" id="w-min" aria-label="Minimise"><svg width="10" height="10" viewBox="0 0 10 10" shape-rendering="crispEdges"><path d="M1 7h8v2H1z" fill="currentColor"/></svg></button>
      <button class="tbtn" id="w-max" aria-label="Maximise"><svg width="10" height="10" viewBox="0 0 10 10" shape-rendering="crispEdges"><path d="M1 1h8v2H1zM1 3h2v6H1zM7 3h2v6H7zM3 7h4v2H3z" fill="currentColor"/></svg></button>
      <button class="tbtn" id="w-close" aria-label="Close"><svg width="10" height="10" viewBox="0 0 10 10" shape-rendering="crispEdges"><path d="M1 1h2v2H1zM3 3h2v2H3zM5 5h2v2H5zM7 7h2v2H7zM7 1h2v2H7zM5 3h2v2H5zM3 5h2v2H3zM1 7h2v2H1z" fill="currentColor"/></svg></button>
    </header>

    <div class="toolbar">
      <label class="search field" for="q">
        <svg width="11" height="11" viewBox="0 0 11 11" shape-rendering="crispEdges" aria-hidden="true"><path d="M3 0h4v1H3zM2 1h1v1H2zM7 1h1v1H7zM1 2h1v4H1zM8 2h1v4H8zM2 6h1v1H2zM7 6h1v1H7zM3 7h4v1H3zM8 7h1v1H8zM9 8h1v1H9zM10 9h1v2h-1z" fill="currentColor"/></svg>
        <input id="q" type="search" placeholder="search thoughts and #tags" autocomplete="off" spellcheck="false" />
        <span class="kbd">/</span>
      </label>
      <button class="btn primary" id="catch" title="Write a new thought">+ new thought <span class="kbd" id="sc-hint"></span></button>
      <button class="btn" id="open-settings" title="Settings">settings</button>
    </div>

    <div class="panes">
      <nav class="side" aria-label="Pockets and filters">
        <ul class="nav-list" id="view-top"></ul>
        <div class="group-label caps" title="Pockets are like folders for your thoughts">pockets</div>
        <ul class="nav-list" id="vault-list"></ul>
        <button class="btn ghost add-vault" id="add-vault">+ new pocket</button>
        <form class="vault-form" id="vault-form" hidden>
          <input class="field" id="vault-name" maxlength="40" placeholder="pocket name" aria-label="Pocket name" />
        </form>

        <ul class="nav-list" id="view-list"></ul>

        <div class="group-label caps" id="cat-label" title="what sort of thought each one is">types</div>
        <ul class="nav-list" id="cat-list"></ul>

        <div class="group-label caps" id="tag-label">tags</div>
        <div class="tags" id="tag-list"></div>
      </nav>

      <section class="list-pane" aria-label="Thoughts">
        <div class="list-head"><span id="list-title">all thoughts</span><span class="count" id="list-count"></span></div>
        <ol class="thoughts field" id="thoughts" tabindex="0" aria-label="Thoughts list"></ol>
      </section>

      <section class="detail" id="detail" aria-label="Thought detail"></section>
    </div>

    <footer class="status">
      <span id="status-left"></span>
      <span class="perch" id="perch"></span>
    </footer>
  </div>

  <dialog class="win dialog" id="settings">
    <header class="titlebar"><span class="title">settings</span><button class="tbtn" id="settings-close" aria-label="Close settings"><svg width="10" height="10" viewBox="0 0 10 10" shape-rendering="crispEdges"><path d="M1 1h2v2H1zM3 3h2v2H3zM5 5h2v2H5zM7 7h2v2H7zM7 1h2v2H7zM5 3h2v2H5zM3 5h2v2H3zM1 7h2v2H1z" fill="currentColor"/></svg></button></header>
    <div class="dialog-body">
      <fieldset>
        <legend>your buddy (the whole app takes its colour)</legend>
        <div class="buddy-grid" id="buddy-grid" role="radiogroup" aria-label="Choose a buddy"></div>
      </fieldset>
      <fieldset>
        <legend>shortcut</legend>
        <div class="row">
          <button class="btn shortcut-btn" id="shortcut-btn" aria-describedby="shortcut-msg"></button>
          <span class="muted" id="shortcut-msg">click, then press new keys</span>
        </div>
      </fieldset>
      <fieldset>
        <legend>behaviour</legend>
        <label class="check"><input type="checkbox" id="opt-pet" /><span class="box" aria-hidden="true"></span> let my buddy hang out on the desktop</label>
        <label class="check"><input type="checkbox" id="opt-login" /><span class="box" aria-hidden="true"></span> start when I log in</label>
        <label class="check"><input type="checkbox" id="opt-suggest" /><span class="box" aria-hidden="true"></span> suggest types, tags and pockets (on this computer)</label>
      </fieldset>
      <fieldset>
        <legend>your data</legend>
        <p class="muted path" id="data-path"></p>
        <div class="row">
          <button class="btn" id="open-data">show file</button>
          <button class="btn" id="export">export as markdown</button>
        </div>
      </fieldset>
    </div>
    <footer class="dialog-foot">
      <span class="muted" id="settings-note"></span>
      <button class="btn" id="settings-cancel">cancel</button>
      <button class="btn primary" id="settings-save" disabled>save changes</button>
    </footer>
  </dialog>

  <script type="module" src="./main.ts"></script>
</body>
</html>
